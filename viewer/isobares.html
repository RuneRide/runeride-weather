<!doctype html>

<!-- Démo autonome de la couche Pression (isobares) : MapLibre 5.24.0, pmtiles 4.5.0, fond Protomaps sombre.
     Serveur : python3 viewer/serve.py (montages /isobares = out/isobars, /basemap = out/basemap).
     Paramètres : ?n=<échéance>&c=<lon,lat>&z=<zoom>&format=geojson|mvt&lissage=0|1&panneau=0&tirage=2026-10-17T06Z&theme=clair -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isobares AROME</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
<style>
  :root { --fond: #17191C; --texte: #EBE8E0; --ocre: #C6934B; --trait: #3a3d42; }
  html, body { height: 100%; margin: 0; background: #101214; color: var(--texte);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #carte { position: absolute; inset: 0; }
  .panneau { position: absolute; left: 12px; right: 12px; bottom: 34px; max-width: 640px; margin: 0 auto; padding: 10px 14px 12px;
             background: rgba(23, 25, 28, .92); border: 1px solid var(--trait); border-radius: 12px; z-index: 2; }
  .ligne { display: flex; align-items: center; gap: 10px; }
  #valide { flex: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
  #ech { font-variant-numeric: tabular-nums; color: var(--ocre); font-weight: 700; }
  button, select { min-height: 44px; min-width: 44px; background: #23262a; color: var(--texte); border: 1px solid var(--trait);
                   border-radius: 8px; font: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ocre); outline-offset: 2px; }
  input[type=range] { flex: 1; min-height: 44px; accent-color: var(--ocre); }
  .options { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; font-size: 13px; align-items: center; }
  .options label { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
  #info { margin-top: 4px; font-size: 12px; color: #a9a69d; min-height: 1.4em; }
  .titre { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(23,25,28,.88); padding: 6px 12px;
           border: 1px solid var(--trait); border-radius: 10px; font-weight: 700; }
  .titre small { font-weight: 400; color: #a9a69d; display: block; }
  .maplibregl-ctrl-attrib { font-size: 11px; }
</style>
</head>
<body>
<div id="carte" role="application" aria-label="Carte des isobares"></div>
<div class="titre">Pression au niveau de la mer<small>AROME 0,025° · isobares tous les 2 hPa</small></div>
<div class="panneau">
  <div class="ligne">
    <button id="prec" aria-label="Échéance précédente">◀</button>
    <button id="lecture" aria-label="Lecture">▶</button>
    <button id="suiv" aria-label="Échéance suivante">▶|</button>
    <div id="valide" aria-live="polite"></div>
    <span id="ech">+0 h</span>
  </div>
  <div class="ligne"><input id="curseur" type="range" min="0" max="51" step="1" value="0" aria-label="Échéance en heures"></div>
  <div class="options">
    <label><input type="checkbox" id="lissage" checked> lissage (σ = 4 mailles)</label>
    <label>format <select id="format"><option value="geojson">GeoJSON</option><option value="mvt">MVT (PMTiles)</option></select></label>
  </div>
  <div id="info"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"
        integrity="sha384-pbKNZbDshUsLnZMIVsn/t+j3xEY9PGfuX5Z22l5rcy/obXz3EwaMx1F5d9sRsJMn" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js"
        integrity="sha384-fzuU7k7ZWwfZAe1+3h7plrSA6dNazJaM2NsKVwcrReJLK0gwVwyOSyPwROl9m1M0" crossorigin="anonymous"></script>
<script type="module">
import { ajouterIsobares, majEcheance, retirerIsobares } from './js/isobares.js';

const P = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const TIRAGE = P.get('tirage') || '2026-10-17T06Z';
const MODELE = 'arome';
const THEME = ['clair', 'light'].includes(P.get('theme')) ? 'light' : 'dark';
const centre = (P.get('c') || '2.5,46.6').split(',').map(Number);
const etat = { n: Math.max(0, Math.min(51, Number(P.get('n') || 0))), format: P.get('format') === 'mvt' ? 'mvt' : 'geojson',
               lissage: P.get('lissage') !== '0', lecture: null };
if (P.get('panneau') === '0') document.querySelector('.panneau').style.display = 'none';
$('curseur').value = etat.n; $('format').value = etat.format; $('lissage').checked = etat.lissage;

// --- fond de carte : style Protomaps (comme viewer/js/main.js), PMTiles local
const protocole = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocole.tile);
const URL_FOND = new URL('/basemap/domaine-z9.pmtiles', location.href).href;
const map = new maplibregl.Map({
  container: 'carte', center: centre, zoom: Number(P.get('z') || 5.2), minZoom: 2.5, maxZoom: 10.5, fadeDuration: 0,
  attributionControl: false, pitchWithRotate: false, dragRotate: false, canvasContextAttributes: { antialias: false },
  style: {
    version: 8, name: 'RuneRide ' + THEME,
    glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
    sprite: 'https://protomaps.github.io/basemaps-assets/sprites/v4/' + THEME,
    sources: { protomaps: { type: 'vector', url: 'pmtiles://' + URL_FOND, attribution: '' } },
    layers: basemaps.layers('protomaps', basemaps.namedFlavor(THEME), { lang: 'fr' }),
  },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution:
  'Météo-France (Licence Ouverte v2.0) · Protomaps © OpenStreetMap contributors' }), 'bottom-left');

const srcDonnees = () => `/isobares/${MODELE}${etat.lissage ? '' : '-sans-lissage'}/${TIRAGE}`;
// premier libellé de lieux du fond : les isobares passent dessous, les noms de villes restent lisibles
const avant = () => (map.getStyle().layers.find(l => /^places_/.test(l.id)) || {}).id;

function libelleValide(n) {
  const t = new Date(Date.UTC(+TIRAGE.slice(0, 4), +TIRAGE.slice(5, 7) - 1, +TIRAGE.slice(8, 10), +TIRAGE.slice(11, 13)) + n * 3600e3);
  const f = (tz, opt) => new Intl.DateTimeFormat('fr-FR', { timeZone: tz, ...opt }).format(t);
  return `${f('Europe/Paris', { weekday: 'short', day: 'numeric', month: 'short' })} ${f('UTC', { hour: '2-digit', hour12: false })} UTC (${f('Europe/Paris', { hour: '2-digit', hour12: false })} Paris)`;
}
function afficher(n) {
  $('valide').textContent = libelleValide(n);
  $('ech').textContent = '+' + n + ' h';
  $('curseur').value = n;
  history.replaceState(null, '', '?' + new URLSearchParams({ n, format: etat.format, lissage: etat.lissage ? 1 : 0,
    c: map.getCenter().lng.toFixed(2) + ',' + map.getCenter().lat.toFixed(2), z: map.getZoom().toFixed(1), ...(THEME === 'light' ? { theme: 'clair' } : {}) }));
}
let dernier = null;
async function aller(n) {
  etat.n = Math.max(0, Math.min(51, n));
  afficher(etat.n);
  const t0 = performance.now();
  try { await majEcheance(map, etat.n); $('info').textContent = `+${etat.n} h chargée en ${Math.round(performance.now() - t0)} ms (${etat.format})`; }
  catch (e) { $('info').textContent = 'Erreur : ' + (e && e.message || e); }
}
async function recharger() {
  const t0 = performance.now();
  retirerIsobares(map);
  try {
    await ajouterIsobares(map, { src: srcDonnees(), avant: avant(), echeance: etat.n, format: etat.format });
    dernier = performance.now() - t0;
    $('info').textContent = `+${etat.n} h : ${Math.round(dernier)} ms (${etat.format})`;
  } catch (e) { $('info').textContent = 'Erreur : ' + (e && e.message || e); }
  afficher(etat.n);
}
$('curseur').addEventListener('input', e => aller(+e.target.value));
$('prec').onclick = () => aller(etat.n - 1);
$('suiv').onclick = () => aller(etat.n + 1);
$('lecture').onclick = () => {
  if (etat.lecture) { clearInterval(etat.lecture); etat.lecture = null; $('lecture').textContent = '▶'; return; }
  $('lecture').textContent = '❚❚';
  etat.lecture = setInterval(() => aller(etat.n >= 51 ? 0 : etat.n + 1), 1000);
};
$('format').onchange = e => { etat.format = e.target.value; recharger(); };
$('lissage').onchange = e => { etat.lissage = e.target.checked; recharger(); };

map.on('error', e => { if (!/isobares/.test(String(e.sourceId))) console.warn('carte :', e.error && e.error.message); });
map.on('load', async () => {
  await recharger();
  map.once('idle', () => { document.title += ' [ok]'; });
});
// accès pour les captures et mesures (viewer/tools/pilote_chrome.mjs)
window.__iso = {
  map, etat, aller, recharger,
  get dernier() { return dernier; },   // ms de la dernière (re)création de la couche, jusqu'aux données chargées
  /** Mesure : retire la couche, la ajoute à nouveau et attend `idle` (rendu terminé) ; renvoie les ms. */
  async mesurer(format, n) {
    etat.format = format; etat.n = n; $('format').value = format;
    const t0 = performance.now();
    retirerIsobares(map);
    await ajouterIsobares(map, { src: srcDonnees(), avant: avant(), echeance: n, format });
    const t1 = performance.now();
    await new Promise(r => map.once('idle', r));
    return { donnees_ms: Math.round(t1 - t0), rendu_ms: Math.round(performance.now() - t0) };
  },
  /** Mesure d'un changement d'échéance (n -> m) jusqu'à `idle`. */
  async changer(m) {
    const t0 = performance.now();
    await majEcheance(map, m); etat.n = m; afficher(m);
    await new Promise(r => map.once('idle', r));
    return Math.round(performance.now() - t0);
  },
  attendreIdle: () => new Promise(r => { if (map.loaded() && !map.isMoving()) r(); else map.once('idle', r); }),
};
</script>
</body>
</html>
