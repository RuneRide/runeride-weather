# SPDX-License-Identifier: EUPL-1.2
[workspace]
resolver = "2"
members = ["crates/rw-grib", "crates/rw-tiles", "crates/rw-cli", "crates/rw-lambda", "crates/rw-isobares", "crates/rw-aws", "crates/rw-poller", "crates/rw-manifeste"]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
rayon = "1"
thiserror = "2"
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
